name: Temporary official Functor formal migration
on:
  push:
    branches: [prepare/functor-formal031]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Install the coherent published formal graph
        run: |
          set -euo pipefail
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          git diff --quiet -- deps.cirru package.json yarn.lock .yarnrc.yml
      - name: Preserve original actual assertions on target toolchain
        run: |
          mkdir -p acceptance
          calcit --check-only --all-defs
          calcit test --list --format json > acceptance/test-list-before.json
          calcit test --require-match
      - name: Official reviewed atomic migration
        run: node apply-reviewed.mjs
      - name: Final full gates, original assertions and relative frontend
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          calcit --check-only --all-defs
          calcit --check-only --ns 'app.$meta' --ns app.browser --ns app.comp.container --ns app.config --ns app.main --ns app.schema --ns app.updater --summary-only
          calcit fix --workflow strict --verify --format json | tee acceptance/strict.json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit test --list --format json > acceptance/test-list-after.json
          calcit test --require-match
          calcit analyze weak-types --only dynamic-method --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'
          yarn compile
          yarn build
          cp calcit.cirru acceptance/snapshot.cirru
          cp -R dist acceptance/dist
      - name: Save official evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: functor-formal-evidence
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
